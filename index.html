<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarvis Automation Studio</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://kit.fontawesome.com/a2e0e6ad5a.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0b0f;
      color: white;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 2rem;
    }
    h1 { text-align: center; font-size: 2.2rem; font-weight: 700; margin-bottom: 2rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background-color: #1a1a23;
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: 0 0 20px rgba(255,255,255,0.05);
    }
    .card h2 { font-size: 1.4rem; font-weight: 600; margin-bottom: 1rem; }
    input, textarea {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border-radius: 0.5rem;
      background: #2a2a38;
      color: white;
      border: 1px solid #3a3a50;
      margin-bottom: 0.75rem;
      font-family: inherit;
      font-size: 0.95rem;
    }
    textarea { min-height: 70px; resize: vertical; }
    .btn {
      background-color: #9c4dff;
      padding: 0.6rem 1.2rem;
      border-radius: 0.5rem;
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover:not(:disabled) { background-color: #7e3be0; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-danger { background-color: #7f1d1d; }
    .btn-danger:hover:not(:disabled) { background-color: #991b1b; }
    .btn-full { width: 100%; }
    .project-card {
      border: 1px solid #2a2a3a;
      border-radius: 0.75rem;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    .project-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.25rem; }
    .project-meta { font-size: 0.8rem; color: #888; margin-bottom: 0.5rem; }
    .project-trigger { font-size: 0.9rem; color: #bbb; margin-bottom: 0.75rem; }
    .btn-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .status-badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 0.4rem;
      font-size: 0.75rem;
      font-weight: 700;
      margin-right: 0.5rem;
    }
    .status-draft { background: #2a2a3a; color: #aaa; }
    .status-processing { background: #78350f; color: #fcd34d; }
    .status-suggestions_ready { background: #4c1d95; color: #c4b5fd; }
    .status-template_selected { background: #14532d; color: #86efac; }
    .status-no_match { background: #450a0a; color: #fca5a5; }
    .results-panel { background: #12121a; border: 1px solid #2a2a3a; border-radius: 0.75rem; padding: 1rem; margin-top: 0.75rem; }
    .match-card { background: #1e1e2e; border: 1px solid #3a3a5a; border-radius: 0.5rem; padding: 0.75rem; margin-bottom: 0.5rem; }
    .match-name { font-weight: 600; margin-bottom: 0.25rem; }
    .match-meta { font-size: 0.75rem; color: #888; margin-bottom: 0.5rem; }
    .msg-success { color: #4ade80; font-size: 0.9rem; margin-top: 0.5rem; }
    .msg-error { color: #f87171; font-size: 0.9rem; margin-top: 0.5rem; }
  </style>
</head>

<body>
  <h1>🚀 Jarvis Automation Studio</h1>

  <div class="grid">
    <div class="card">
      <h2>Create New Project</h2>
      <form id="projectForm">
        <input name="title" placeholder="Project Title" required />
        <textarea name="trigger" placeholder="Trigger: what starts this automation?" required></textarea>
        <textarea name="actions" placeholder="Actions: what should happen automatically?" required></textarea>
        <textarea name="notes" placeholder="Notes (optional)"></textarea>
        <button type="submit" id="submitBtn" class="btn btn-full">
          <i class="fas fa-rocket"></i> Create Project
        </button>
      </form>
      <p id="formMessage"></p>
    </div>

    <div class="card">
      <h2>Your Projects</h2>
      <div id="projectsList"><p style="color:#888">Loading projects...</p></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://lbbsbiufwdjatjlhpvsg.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxiYnNiaXVmd2RqYXRqbGhwdnNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA1OTk2NzksImV4cCI6MjA3NjE3NTY3OX0._79MBz4Rx6bvCn8ICgeRLG5TW2Cre29UNCFACgEI8rg";
    const EDGE_FUNCTION_URL = "https://lbbsbiufwdjatjlhpvsg.supabase.co/functions/v1/automation-studio-ts";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showMessage(elId, msg, type) {
      const el = document.getElementById(elId);
      el.innerText = msg;
      el.className = type === "error" ? "msg-error" : "msg-success";
    }

    function statusClass(status) {
      const map = {
        "processing": "status-processing",
        "suggestions_ready": "status-suggestions_ready",
        "template_selected": "status-template_selected",
        "no_match": "status-no_match",
      };
      return map[status] || "status-draft";
    }

    async function loadProjects() {
      const list = document.getElementById("projectsList");
      list.innerHTML = "<p style='color:#888'>Loading...</p>";
      const { data, error } = await sb.from("projects").select("*").order("created_at", { ascending: false });
      if (error) { list.innerHTML = "<p style='color:#f87171'>Error: " + error.message + "</p>"; return; }
      if (!data.length) { list.innerHTML = "<p style='color:#888'>No projects yet. Create one!</p>"; return; }

      list.innerHTML = "";
      data.forEach(p => {
        const div = document.createElement("div");
        div.className = "project-card";
        div.id = "project-" + p.id;

        let suggestionsHtml = "";
        if (p.suggestions && p.suggestions.length > 0) {
          suggestionsHtml = `<div class="results-panel">
            <p style="color:#a78bfa;font-weight:600;margin-bottom:0.5rem">✨ Top Workflow Matches:</p>
            ${p.suggestions.map(s => `
              <div class="match-card">
                <div class="match-name">#${s.rank} — ${s.name}</div>
                <div class="match-meta">Score: ${s.match_score}</div>
                <button class="btn" onclick="selectTemplate('${p.id}', '${s.id}')">
                  <i class="fas fa-check"></i> Use This Template
                </button>
              </div>`).join("")}
          </div>`;
        }

        if (p.template_name) {
          suggestionsHtml += `<p class="msg-success">✅ Template selected: <strong>${p.template_name}</strong></p>`;
        }

        div.innerHTML = `
          <div class="project-title">${p.title}</div>
          <div class="project-meta">
            <span class="status-badge ${statusClass(p.status)}">${p.status || "draft"}</span>
            ${new Date(p.created_at).toLocaleString()}
          </div>
          <div class="project-trigger">${p.trigger_description || ""}</div>
          <div class="btn-row">
            <button class="btn" id="gen-${p.id}" onclick="generateWorkflow('${p.id}')">
              <i class="fas fa-code-branch"></i> Generate
            </button>
            <button class="btn btn-danger" onclick="deleteProject('${p.id}')">
              <i class="fas fa-trash"></i> Delete
            </button>
          </div>
          ${suggestionsHtml}
          ${p.error_reason ? `<p class="msg-error">❌ ${p.error_reason}</p>` : ""}
        `;
        list.appendChild(div);
      });
    }

    async function generateWorkflow(projectId) {
      const btn = document.getElementById("gen-" + projectId);
      btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> Searching...";
      btn.disabled = true;
      try {
        const res = await fetch(EDGE_FUNCTION_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + SUPABASE_ANON_KEY },
          body: JSON.stringify({ project_id: projectId, action: "generate" })
        });
        const result = await res.json();
        if (!result.success) {
          alert("❌ " + result.error);
          btn.innerHTML = "<i class='fas fa-code-branch'></i> Generate";
          btn.disabled = false;
        } else {
          await loadProjects();
        }
      } catch (err) {
        alert("❌ Network error: " + err.message);
        btn.innerHTML = "<i class='fas fa-code-branch'></i> Generate";
        btn.disabled = false;
      }
    }

    async function selectTemplate(projectId, workflowId) {
      const res = await fetch(EDGE_FUNCTION_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + SUPABASE_ANON_KEY },
        body: JSON.stringify({ project_id: projectId, workflow_id: workflowId, action: "select_template" })
      });
      const result = await res.json();
      if (!result.success) { alert("❌ " + result.error); }
      else { alert("✅ Template selected: " + result.workflow_name); loadProjects(); }
    }

    async function deleteProject(id) {
      if (!confirm("Delete this project? Cannot be undone.")) return;
      await sb.from("projects").delete().eq("id", id);
      loadProjects();
    }

    document.getElementById("projectForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const btn = document.getElementById("submitBtn");
      btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> Creating...";
      btn.disabled = true;

      const { error } = await sb.from("projects").insert([{
        title: fd.get("title"),
        trigger_description: fd.get("trigger"),
        actions_description: fd.get("actions"),
        notes: fd.get("notes"),
        status: "Idea Submitted",
      }]);

      if (error) { showMessage("formMessage", "❌ Error: " + error.message, "error"); }
      else { showMessage("formMessage", "✅ Project created! Hit Generate to find workflows.", "success"); e.target.reset(); loadProjects(); }

      btn.innerHTML = "<i class='fas fa-rocket'></i> Create Project";
      btn.disabled = false;
    });

    loadProjects();
  </script>
</body>
</html>
