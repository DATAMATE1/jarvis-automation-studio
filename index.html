<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarvis Automation Studio</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://kit.fontawesome.com/a2e0e6ad5a.js" crossorigin="anonymous"></script>

  <style>
    body {
      background-color: #0b0b0f;
      color: white;
      font-family: 'Inter', sans-serif;
    }
    .card {
      background-color: #1a1a23;
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: 0 0 20px rgba(255,255,255,0.05);
    }
    .btn {
      background-color: #9c4dff;
      padding: 0.6rem 1.2rem;
      border-radius: 0.5rem;
      color: white;
      font-weight: 600;
      transition: 0.2s;
      cursor: pointer;
    }
    .btn:hover:not(:disabled) { background-color: #7e3be0; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Results panel */
    .results-panel {
      background: #12121a;
      border: 1px solid #2a2a3a;
      border-radius: 0.75rem;
      padding: 1rem;
      margin-top: 0.75rem;
    }
    .match-card {
      background: #1e1e2e;
      border: 1px solid #3a3a5a;
      border-radius: 0.5rem;
      padding: 0.75rem;
      margin-bottom: 0.5rem;
    }
  </style>
</head>

<body class="min-h-screen p-8">
  <h1 class="text-4xl font-bold mb-6 text-center">🚀 Jarvis Automation Studio</h1>

  <div class="grid md:grid-cols-2 gap-6">
    <!-- Create Project -->
    <div class="card">
      <h2 class="text-2xl font-semibold mb-4">Create New Project</h2>
      <form id="projectForm" class="space-y-3">
        <input name="title" class="w-full p-2 rounded bg-gray-800 text-white" placeholder="Project Title" required />
        <textarea name="trigger" class="w-full p-2 rounded bg-gray-800 text-white" placeholder="Trigger description..." required></textarea>
        <textarea name="actions" class="w-full p-2 rounded bg-gray-800 text-white" placeholder="Actions description..." required></textarea>
        <textarea name="notes" class="w-full p-2 rounded bg-gray-800 text-white" placeholder="Notes (optional)"></textarea>
        <button type="submit" id="submitBtn" class="btn w-full"><i class="fas fa-rocket mr-2"></i>Create Project</button>
      </form>
      <p id="formMessage" class="mt-3 text-sm"></p>
    </div>

    <!-- Projects List -->
    <div class="card">
      <h2 class="text-2xl font-semibold mb-4">Your Projects</h2>
      <div id="projectsList" class="space-y-3">
        <p class="text-gray-400">Loading projects...</p>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://lbbsbiufwdjatjlhpvsg.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxiYnNiaXVmd2RqYXRqbGhwdnNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA1OTk2NzksImV4cCI6MjA3NjE3NTY3OX0._79MBz4Rx6bvCn8ICgeRLG5TW2Cre29UNCFACgEI8rg";
    const EDGE_FUNCTION_URL = "https://lbbsbiufwdjatjlhpvsg.supabase.co/functions/v1/automation-studio-ts";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showMessage(elId, msg, type = "success") {
      const el = document.getElementById(elId);
      el.innerText = msg;
      el.className = type === "error" ? "text-red-400 mt-3 text-sm" : "text-green-400 mt-3 text-sm";
    }

    async function loadProjects() {
      const list = document.getElementById("projectsList");
      list.innerHTML = "<p class='text-gray-400'>Loading...</p>";

      const { data, error } = await supabase
        .from("projects")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) { list.innerHTML = "<p class='text-red-400'>Error loading projects.</p>"; return; }
      if (!data.length) { list.innerHTML = "<p class='text-gray-400'>No projects yet. Create one!</p>"; return; }

      list.innerHTML = "";
      data.forEach(p => {
        const div = document.createElement("div");
        div.className = "border border-gray-700 rounded p-3";
        div.id = `project-${p.id}`;

        // Build suggestions HTML if they exist
        let suggestionsHtml = "";
        if (p.suggestions && p.suggestions.length > 0) {
          suggestionsHtml = `
            <div class="results-panel">
              <p class="text-purple-400 font-semibold mb-2">✨ Top Workflow Matches:</p>
              ${p.suggestions.map(s => `
                <div class="match-card">
                  <p class="font-semibold text-white">#${s.rank} — ${s.name}</p>
                  <p class="text-gray-400 text-xs mt-1">Score: ${s.match_score} | Keywords: ${[...(s.trigger_keywords||[]), ...(s.action_keywords||[])].slice(0,5).join(", ")}</p>
                  <button class="btn text-xs mt-2" onclick="selectTemplate('${p.id}', '${s.id}')">
                    <i class="fas fa-check mr-1"></i>Use This Template
                  </button>
                </div>
              `).join("")}
            </div>`;
        }

        if (p.template_name) {
          suggestionsHtml += `<p class="mt-2 text-green-400 text-sm">✅ Template selected: <strong>${p.template_name}</strong></p>`;
        }

        div.innerHTML = `
          <h3 class="text-xl font-semibold mb-1">${p.title}</h3>
          <p class="text-gray-400 text-sm mb-2">
            <span class="inline-block px-2 py-0.5 rounded text-xs font-bold ${statusColor(p.status)}">${p.status || "draft"}</span>
            — ${new Date(p.created_at).toLocaleString()}
          </p>
          <p class="text-gray-300 mb-3 text-sm">${p.trigger_description || ""}</p>
          <div class="flex flex-wrap gap-2">
            <button class="btn text-sm" id="gen-btn-${p.id}" onclick="generateWorkflow('${p.id}')">
              <i class='fas fa-code-branch mr-1'></i>Generate
            </button>
            <button class="btn text-sm bg-red-800 hover:bg-red-700" onclick="deleteProject('${p.id}')">
              <i class='fas fa-trash mr-1'></i>Delete
            </button>
          </div>
          ${suggestionsHtml}
          ${p.error_reason ? `<p class='mt-2 text-red-400 text-sm'>❌ ${p.error_reason}</p>` : ""}
        `;
        list.appendChild(div);
      });
    }

    function statusColor(status) {
      if (!status) return "bg-gray-700 text-gray-300";
      if (status === "suggestions_ready") return "bg-purple-800 text-purple-200";
      if (status === "template_selected") return "bg-green-800 text-green-200";
      if (status === "processing") return "bg-yellow-800 text-yellow-200";
      if (status === "no_match") return "bg-red-900 text-red-300";
      return "bg-gray-700 text-gray-300";
    }

    // ✅ FIXED: Generate now calls edge function with action "generate"
    async function generateWorkflow(projectId) {
      const btn = document.getElementById(`gen-btn-${projectId}`);
      btn.innerHTML = "<i class='fas fa-spinner fa-spin mr-1'></i>Searching...";
      btn.disabled = true;

      try {
        const res = await fetch(EDGE_FUNCTION_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + SUPABASE_ANON_KEY
          },
          body: JSON.stringify({ project_id: projectId, action: "generate" })
        });

        const result = await res.json();

        if (!result.success) {
          alert("❌ Error: " + result.error);
        } else {
          // Reload to show matches
          await loadProjects();
          return;
        }
      } catch (err) {
        alert("❌ Network error: " + err.message);
      }

      btn.innerHTML = "<i class='fas fa-code-branch mr-1'></i>Generate";
      btn.disabled = false;
    }

    // Select a template from the matches
    async function selectTemplate(projectId, workflowId) {
      const res = await fetch(EDGE_FUNCTION_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + SUPABASE_ANON_KEY
        },
        body: JSON.stringify({ project_id: projectId, workflow_id: workflowId, action: "select_template" })
      });

      const result = await res.json();
      if (!result.success) {
        alert("❌ Error: " + result.error);
      } else {
        alert("✅ Template selected: " + result.workflow_name);
        loadProjects();
      }
    }

    async function deleteProject(id) {
      if (!confirm("Delete this project? This cannot be undone.")) return;
      await supabase.from("projects").delete().eq("id", id);
      loadProjects();
    }

    document.getElementById("projectForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const fd = new FormData(form);
      const btn = document.getElementById("submitBtn");

      btn.innerHTML = "<i class='fas fa-spinner fa-spin mr-2'></i>Creating...";
      btn.disabled = true;

      const { error } = await supabase.from("projects").insert([{
        title: fd.get("title"),
        trigger_description: fd.get("trigger"),
        actions_description: fd.get("actions"),
        notes: fd.get("notes"),
        status: "Idea Submitted",
      }]);

      if (error) {
        showMessage("formMessage", "❌ Error: " + error.message, "error");
      } else {
        showMessage("formMessage", "✅ Project created! Hit Generate to find workflows.");
        form.reset();
        loadProjects();
      }

      btn.innerHTML = '<i class="fas fa-rocket mr-2"></i>Create Project';
      btn.disabled = false;
    });

    loadProjects();
  </script>
</body>
</html>
