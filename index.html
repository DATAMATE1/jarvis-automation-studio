<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis Automation Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
      color: #1a1a1a;
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 30px; color: #4a2c8c; }
    .card { background: #ffffff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 20px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.05 ); }
    .status-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-left: 10px; }
    .status-idea-submitted { background: #f3e5f5; color: #7b1fa2; }
    .status-blueprint-ready { background: #e3f2fd; color: #1976d2; }
    .status-test-complete { background: #e8f5e9; color: #388e3c; }
    .status-revision-requested { background: #fff8e1; color: #ff8f00; }
    .status-completed { background: #e8f5e8; color: #2e7d32; }
    .status-error { background: #ffebee; color: #d32f2f; }
    .diagram { background: #f8f9fa; padding: 16px; border-radius: 8px; font-family: monospace; margin: 16px 0; border: 1px solid #eee; text-align: center; }
    .test-results { margin: 16px 0; padding: 12px; border-radius: 8px; background: #f9f9f9; border-left: 4px solid #ccc; white-space: pre-wrap; }
    .test-success { border-left-color: #4caf50; }
    .test-error { border-left-color: #f44336; }
    .buttons { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; transition: all 0.2s; }
    .btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    .btn:disabled { cursor: not-allowed; opacity: 0.6; }
    .btn-primary { background: #4a2c8c; color: white; }
    .btn-generate { background: #4a2c8c; color: white; }
    .btn-test { background: #1976d2; color: white; }
    .btn-revise { background: #ff9800; color: white; }
    .btn-deploy { background: #4caf50; color: white; }
    .revise-input { width: 100%; padding: 12px; margin: 12px 0; border: 1px solid #ccc; border-radius: 8px; background: #ffffff; color: #333; font-size: 16px; }
    .live-link { display: block; color: #4a2c8c; text-decoration: none; margin-top: 12px; word-break: break-all; font-weight: bold; }
    label { display: block; margin-top: 16px; font-weight: 600; color: #333; }
    input, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
    textarea { min-height: 80px; resize: vertical; }
    .loading-spinner { display: inline-block; width: 16px; height: 16px; border: 3px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .inline-message { margin-top: 15px; padding: 10px; border-radius: 8px; display: none; }
    .inline-success { background: #e8f5e9; color: #388e3c; }
    .inline-error { background: #ffebee; color: #d32f2f; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 Jarvis Automation Studio</h1>
    
    <div class="card">
      <h2>New Automation Request</h2>
      <label>Project Goal (One-Liner)</label>
      <input id="title" placeholder="e.g., Automate new lead entry from website form into HubSpot & Slack">
      
      <label>Trigger (What starts it?)</label>
      <input id="trigger" placeholder="e.g., New form submission on 'Contact Us' Typeform">
      
      <label>Actions (What should happen?)</label>
      <textarea id="actions" placeholder="e.g., Take 'Email', 'Name'... In HubSpot: Find or Create Contact..."></textarea>
      
      <label>The 'Gotcha' (Any if-then rules?)</label>
      <textarea id="notes" placeholder="e.g., IF Budget > $10k, THEN tag 'High-Priority'"></textarea>
      
      <button id="submitBtn" class="btn btn-primary">
        ✅ Submit to Production
      </button>
    </div>

    <div class="card" id="projectCard" style="display:none;">
      <h2 id="projectTitle"></h2>
      <div><strong>Trigger:</strong> <span id="triggerDesc"></span></div>
      <div><strong>Actions:</strong> <span id="actionsDesc"></span></div>
      
      <div style="margin: 16px 0;">
        <strong>Status:</strong> 
        <span id="statusBadge" class="status-badge"></span>
      </div>

      <div id="blueprintSection" style="display:none;">
        <div class="diagram" id="diagram"></div>
      </div>
      
      <div id="testResultsSection" style="display:none;" class="test-results"></div>

      <div id="inlineMessage" class="inline-message"></div>

      <textarea class="revise-input" id="revisionFeedback" placeholder="Type your revision request (e.g., 'Use Telegram instead of WhatsApp')"></textarea>

      <div class="buttons">
        <button class="btn btn-generate" onclick="generateBlueprint()">Generate Blueprint</button>
        <button class="btn btn-test" onclick="testBlueprint()">Test</button>
        <button class="btn btn-revise" onclick="reviseBlueprint()">Revise</button>
        <button class="btn btn-deploy" onclick="deployBlueprint()">Deploy to Make.com</button>
      </div>

      <a href="#" class="live-link" id="liveLink" style="display:none;"></a>
    </div>
  </div>

  <!-- Production-Ready Script with all fixes and improvements -->
  <script type="module">
    // Import Mermaid.js for rendering diagrams
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

    // === 1. SUPABASE SETUP (FIXED ) ===
    const SUPABASE_URL = 'https://lbbsbiufwdjatjlhpvsg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxiYnNiaXVmd2RqYXRqbGhwdnNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA1OTk2NzksImV4cCI6MjA3NjE3NTY3OX0._79MBz4Rx6bvCn8ICgeRLG5TW2Cre29UNCFACgEI8rg';
    // FIX: The global object is 'Supabase', not 'supabase'.
    const supabaseClient = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY );

    // === 2. DOM ELEMENT CACHING ===
    const elements = {
        submitBtn: document.getElementById('submitBtn'),
        projectCard: document.getElementById('projectCard'),
        projectTitle: document.getElementById('projectTitle'),
        triggerDesc: document.getElementById('triggerDesc'),
        actionsDesc: document.getElementById('actionsDesc'),
        statusBadge: document.getElementById('statusBadge'),
        blueprintSection: document.getElementById('blueprintSection'),
        diagram: document.getElementById('diagram'),
        testResultsSection: document.getElementById('testResultsSection'),
        inlineMessage: document.getElementById('inlineMessage'),
        revisionFeedback: document.getElementById('revisionFeedback'),
        liveLink: document.getElementById('liveLink'),
        actionButtons: document.querySelectorAll('.buttons .btn')
    };
    let currentProjectId = null;

    // === 3. UI HELPER FUNCTIONS (IMPROVED) ===
    function showMessage(message, type = 'info') {
        elements.inlineMessage.textContent = message;
        elements.inlineMessage.className = `inline-message inline-${type}`;
        elements.inlineMessage.style.display = 'block';
    }

    function hideMessage() {
        elements.inlineMessage.style.display = 'none';
    }

    function setButtonsLoading(isLoading) {
        elements.actionButtons.forEach(btn => {
            btn.disabled = isLoading;
            if (isLoading) {
                btn.innerHTML = '<span class="loading-spinner"></span>';
            }
        });
        // Restore original text after loading
        if (!isLoading) {
            document.querySelector('.btn-generate').textContent = 'Generate Blueprint';
            document.querySelector('.btn-test').textContent = 'Test';
            document.querySelector('.btn-revise').textContent = 'Revise';
            document.querySelector('.btn-deploy').textContent = 'Deploy to Make.com';
        }
    }

    // === 4. CORE LOGIC ===
    async function submitRequest() {
      const form = {
        title: document.getElementById('title').value,
        trigger: document.getElementById('trigger').value,
        actions: document.getElementById('actions').value,
        notes: document.getElementById('notes').value
      };

      if (!form.title || !form.trigger || !form.actions) {
        alert('Please fill in Title, Trigger, and Actions.');
        return;
      }

      elements.submitBtn.disabled = true;
      elements.submitBtn.innerHTML = '<span class="loading-spinner"></span> Submitting...';

      const { data, error } = await supabaseClient
        .from('projects')
        .insert({ 
            title: form.title, 
            trigger_description: form.trigger, 
            actions_description: form.actions, 
            notes: form.notes, 
            status: 'Idea Submitted' 
        })
        .select()
        .single();

      elements.submitBtn.disabled = false;
      elements.submitBtn.textContent = '✅ Submit to Production';

      if (error) {
        alert(`❌ Error saving project: ${error.message}`);
        return;
      }
      
      alert('✅ Request submitted successfully!');
      currentProjectId = data.id;
      updateProjectCard(data);
      elements.projectCard.style.display = 'block';
      document.getElementById('title').form.reset(); // Clear the form
    }

    async function callEdgeFunction(action, extraParams = {}) {
      if (!currentProjectId) {
        showMessage('No project ID found. Please submit a project first.', 'error');
        return;
      }
      
      hideMessage();
      setButtonsLoading(true);

      const body = {
        action: action,
        project_id: currentProjectId,
        ...extraParams
      };

      try {
        // FIX: The body of invoke must be a string.
        const { data, error } = await supabaseClient.functions.invoke('automation-studio-ts', {
            body: JSON.stringify(body)
        });

        if (error) throw new Error(error.message);
        if (data.error) throw new Error(data.error); // Handle application-level errors from the function

        showMessage(`Action '${action}' completed successfully!`, 'success');
        
        const { data: updatedProject, error: fetchError } = await supabaseClient
            .from('projects')
            .select('*')
            .eq('id', currentProjectId)
            .single();
        
        if (fetchError) {
            showMessage(`Could not refresh project data: ${fetchError.message}`, 'error');
        } else {
            updateProjectCard(updatedProject);
            // FIX: Clear revision input after successful submission
            if (action === 'revise') {
                elements.revisionFeedback.value = '';
            }
        }
        
      } catch (error) {
        console.error('Invoke Error:', error);
        showMessage(`Error during '${action}': ${error.message}`, 'error');
      } finally {
        setButtonsLoading(false);
      }
    }
    
    function updateProjectCard(project) {
        elements.projectTitle.textContent = project.title;
        elements.triggerDesc.textContent = project.trigger_description;
        elements.actionsDesc.textContent = project.actions_description;
        elements.statusBadge.textContent = project.status;
        elements.statusBadge.className = `status-badge status-${project.status.toLowerCase().replace(/ /g, '-')}`;
        
        // FIX: Safely handle potentially null blueprint and render diagram
        if (project.blueprint?.diagram_mermaid) {
            elements.diagram.innerHTML = ''; // Clear previous diagram
            elements.diagram.removeAttribute('data-processed'); // Reset Mermaid status
            elements.diagram.appendChild(document.createTextNode(project.blueprint.diagram_mermaid));
            mermaid.run({ nodes: [elements.diagram] });
            elements.blueprintSection.style.display = 'block';
        } else {
            elements.blueprintSection.style.display = 'none';
        }

        // FIX: Safely handle potentially null test_results
        if (project.test_results) {
            elements.testResultsSection.textContent = project.test_results.message || 'No message provided.';
            elements.testResultsSection.className = `test-results ${project.test_results.success ? 'test-success' : 'test-error'}`;
            elements.testResultsSection.style.display = 'block';
        } else {
            elements.testResultsSection.style.display = 'none';
        }
        
        if (project.output_url) {
            elements.liveLink.href = project.output_url;
            elements.liveLink.textContent = `🔗 Live Automation: ${project.output_url}`;
            elements.liveLink.style.display = 'block';
        } else {
            elements.liveLink.style.display = 'none';
        }
    }

    // === 5. EVENT LISTENERS ===
    // Make functions globally accessible for onclick attributes
    window.generateBlueprint = () => callEdgeFunction('generate_blueprint');
    window.testBlueprint = () => callEdgeFunction('test_blueprint');
    window.reviseBlueprint = () => {
      const feedback = elements.revisionFeedback.value;
      if (!feedback.trim()) {
        showMessage('Please enter revision feedback.', 'error');
        return;
      }
      callEdgeFunction('revise', { feedback });
    };
    window.deployBlueprint = () => {
      if (confirm('Deploy to Make.com? This will create a live automation.')) {
        callEdgeFunction('deploy');
      }
    };
    
    elements.submitBtn.addEventListener('click', submitRequest);
    mermaid.initialize({ startOnLoad: false, theme: 'default' });
  </script>
</body>
</html>
