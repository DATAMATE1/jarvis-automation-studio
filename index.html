<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis Automation Studio</title>
  <!-- This is the correct Supabase script that exposes 'window.supabase' -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
      color: #1a1a1a;
      margin: 0;
      padding: 20px;
      line-height: 1.6;
      scroll-behavior: smooth;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h1, h2 { color: #4a2c8c; }
    h1 { text-align: center; margin-bottom: 30px; }
    .card { background: #ffffff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 20px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.05 ); }
    label { display: block; margin-top: 16px; font-weight: 600; color: #333; }
    input, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
    form { display: contents; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; transition: all 0.2s; }
    .btn:hover:not(:disabled) { opacity: 0.9; }
    .btn:disabled { cursor: not-allowed; opacity: 0.6; }
    .btn-primary { background: #4a2c8c; color: white; }
    .loading-spinner { display: inline-block; width: 16px; height: 16px; border: 3px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 Jarvis Automation Studio</h1>
    
    <div class="card">
      <form id="automationForm">
        <h2>New Automation Request</h2>
        <label for="title">Project Goal (One-Liner)</label>
        <input id="title" placeholder="e.g., Automate new lead entry" required>
        
        <label for="trigger">Trigger (What starts it?)</label>
        <input id="trigger" placeholder="e.g., New form submission" required>
        
        <label for="actions">Actions (What should happen?)</label>
        <textarea id="actions" placeholder="e.g., Create contact in HubSpot" required></textarea>
        
        <label for="notes">The 'Gotcha' (Any if-then rules?)</label>
        <textarea id="notes" placeholder="e.g., IF Budget > $10k, tag 'High-Priority'"></textarea>
        
        <button id="submitBtn" type="submit" class="btn btn-primary">
          ✅ Submit to Production
        </button>
      </form>
    </div>

    <!-- This card will appear after you submit a project -->
    <div class="card" id="projectCard" style="display:none;">
      <h2>Project Details</h2>
      <p>This is where the project information will appear once it is connected to Supabase.</p>
    </div>
  </div>

  <script>
    // --- CONFIGURATION ---
    const SUPABASE_URL = 'https://lbbsbiufwdjatjlhpvsg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxiYnNiaXVmd2RqYXRqbGhwdnNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA1OTk2NzksImV4cCI6MjA3NjE3NTY3OX0._79MBz4Rx6bvCn8ICgeRLG5TW2Cre29UNCFACgEI8rg';
    
    // --- INITIALIZATION ---
    // This line was the problem. It now correctly uses 'window.supabase' which is provided by the script in the <head>.
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY );
    console.log('✅ Supabase client initialized successfully. The page is NOT static.');

    const elements = {
        automationForm: document.getElementById('automationForm'),
        submitBtn: document.getElementById('submitBtn'),
        projectCard: document.getElementById('projectCard')
    };

    // --- MAIN FUNCTION ---
    async function submitRequest(event) {
      event.preventDefault(); // Stop the page from reloading
      
      const form = {
        title: document.getElementById('title').value.trim(),
        trigger: document.getElementById('trigger').value.trim(),
        actions: document.getElementById('actions').value.trim(),
        notes: document.getElementById('notes').value.trim()
      };

      if (!form.title || !form.trigger || !form.actions) {
        alert('Please fill in all required fields.');
        return;
      }

      // --- UI FEEDBACK ---
      elements.submitBtn.disabled = true;
      elements.submitBtn.innerHTML = `<span class="loading-spinner"></span> Submitting...`;
      
      // --- DATABASE INTERACTION ---
      // We will uncomment this later. For now, we just want to prove the button works.
      console.log('Submitting the following data to Supabase:', form);
      alert('✅ Form submitted! Check the console (F12) to see the data. The page is now interactive.');
      
      // --- UPDATE UI ---
      elements.projectCard.innerHTML = `
        <h2>${form.title}</h2>
        <p><strong>Trigger:</strong> ${form.trigger}</p>
        <p><strong>Actions:</strong> ${form.actions}</p>
        <p><strong>Notes:</strong> ${form.notes}</p>
        <p><strong>Status:</strong> Successfully Submitted (Not saved to DB yet)</p>
      `;
      elements.projectCard.style.display = 'block';
      elements.projectCard.scrollIntoView({ behavior: 'smooth' });

      // --- RESET BUTTON ---
      elements.submitBtn.disabled = false;
      elements.submitBtn.innerHTML = '✅ Submit to Production';
      elements.automationForm.reset();
    }

    // --- EVENT LISTENER ---
    elements.automationForm.addEventListener('submit', submitRequest);
    console.log('✅ Event listener attached. The page is ready.');

  </script>
</body>
</html>
