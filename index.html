<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarvis Automation Studio</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://kit.fontawesome.com/a2e0e6ad5a.js" crossorigin="anonymous"></script>

  <style>
    body {
      background-color: #0b0b0f;
      color: white;
      font-family: 'Inter', sans-serif;
    }
    .card {
      background-color: #1a1a23;
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: 0 0 20px rgba(255,255,255,0.05 );
    }
    .btn {
      background-color: #9c4dff;
      padding: 0.6rem 1.2rem;
      border-radius: 0.5rem;
      color: white;
      font-weight: 600;
      transition: 0.2s;
      cursor: pointer;
    }
    .btn:hover:not(:disabled) { background-color: #7e3be0; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>

<body class="min-h-screen p-8">
  <h1 class="text-4xl font-bold mb-6 text-center">🚀 Jarvis Automation Studio</h1>

  <div class="grid md:grid-cols-2 gap-6">
    <!-- Create Project -->
    <div class="card">
      <h2 class="text-2xl font-semibold mb-4">Create New Project</h2>
      <form id="projectForm" class="space-y-3">
        <input name="title" class="w-full p-2 rounded bg-gray-800 text-white" placeholder="Project Title" required />
        <textarea name="trigger" class="w-full p-2 rounded bg-gray-800 text-white" placeholder="Trigger description..." required></textarea>
        <textarea name="actions" class="w-full p-2 rounded bg-gray-800 text-white" placeholder="Actions description..." required></textarea>
        <textarea name="notes" class="w-full p-2 rounded bg-gray-800 text-white" placeholder="Notes (optional)"></textarea>
        <button type="submit" id="submitBtn" class="btn w-full"><i class="fas fa-rocket mr-2"></i>Create Project</button>
      </form>
      <p id="formMessage" class="mt-3 text-sm"></p>
    </div>

    <!-- Projects List -->
    <div class="card">
      <h2 class="text-2xl font-semibold mb-4">Your Projects</h2>
      <div id="projectsList" class="space-y-3">
        <p class="text-gray-400">Loading projects...</p>
      </div>
    </div>
  </div>

  <!-- This div is for the Mermaid diagram, if you choose to add it back later -->
  <div id="diagram-container" class="card mt-6" style="display:none;">
    <h2 class="text-2xl font-semibold mb-4">Blueprint Diagram</h2>
    <div id="diagram"></div>
  </div>

  <script>
    // --- ✅ FIXED: YOUR SUPABASE DETAILS ---
    const SUPABASE_URL = "https://lbbsbiufwdjatjlhpvsg.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxiYnNiaXVmd2RqYXRqbGhwdnNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA1OTk2NzksImV4cCI6MjA3NjE3NTY3OX0._79MBz4Rx6bvCn8ICgeRLG5TW2Cre29UNCFACgEI8rg";
    const EDGE_FUNCTION_URL = "https://lbbsbiufwdjatjlhpvsg.supabase.co/functions/v1/automation-studio-ts";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY );

    // 🧩 Helper to show messages
    function showMessage(elId, msg, type = "success") {
      const el = document.getElementById(elId);
      el.innerText = msg;
      el.className = type === "error" ? "text-red-400" : "text-green-400";
    }

    // 🧾 Load all projects
    async function loadProjects() {
      const list = document.getElementById("projectsList");
      list.innerHTML = "<p class='text-gray-400'>Loading...</p>";

      const { data, error } = await supabase
        .from("projects")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        list.innerHTML = "<p class='text-red-400'>Error loading projects.</p>";
        return;
      }
      if (!data.length) {
        list.innerHTML = "<p class='text-gray-400'>No projects found.</p>";
        return;
      }

      list.innerHTML = "";
      data.forEach(p => {
        const div = document.createElement("div");
        div.className = "border border-gray-700 rounded p-3";
        div.innerHTML = `
          <h3 class="text-xl font-semibold mb-1">${p.title}</h3>
          <p class="text-gray-400 text-sm mb-2">${p.status || "draft"} — ${new Date(p.created_at).toLocaleString()}</p>
          <p class="text-gray-300 mb-3">${p.trigger_description || ""}</p>
          <div class="flex flex-wrap gap-2">
            <button class="btn text-sm" onclick="triggerAction('${p.id}','generate_blueprint')"><i class='fas fa-code-branch mr-1'></i>Generate</button>
            <button class="btn text-sm" onclick="triggerAction('${p.id}','test_blueprint')"><i class='fas fa-vial mr-1'></i>Test</button>
            <button class="btn text-sm" onclick="triggerAction('${p.id}','deploy')"><i class='fas fa-play mr-1'></i>Deploy</button>
            <button class="btn text-sm bg-red-800 hover:bg-red-700" onclick="deleteProject('${p.id}')"><i class='fas fa-trash mr-1'></i>Delete</button>
          </div>
          ${p.output_url ? `<p class='mt-2 text-green-400 font-semibold'><a href='${p.output_url}' target='_blank'>✅ Open Live Scenario ↗</a></p>` : ""}
          ${p.error_log ? `<p class='mt-2 text-red-400 font-semibold'>❌ Error: ${p.error_log}</p>` : ""}
        `;
        list.appendChild(div);
      });
    }

    // 🗑️ Delete project
    async function deleteProject(id) {
      if (!confirm("Are you sure you want to delete this project? This cannot be undone.")) return;
      await supabase.from("projects").delete().eq("id", id);
      loadProjects();
    }

    // 🚀 Call automation-studio Edge Function
    async function triggerAction(projectId, action) {
      alert(`Sending action: '${action}' for project ID: ${projectId}`);
      const res = await fetch(EDGE_FUNCTION_URL, {
        method: "POST",
        headers: { 
          "Content-Type": "application/json",
          // The Authorization header is often needed when calling functions directly
          "Authorization": "Bearer " + SUPABASE_ANON_KEY
        },
        body: JSON.stringify({ project_id: projectId, action }),
      });
      const result = await res.json();
      
      if (result.error) {
        alert("❌ Error: " + result.error);
      } else {
        alert("✅ Success: " + (result.message || "Action complete. Refreshing..."));
      }
      
      loadProjects();
    }

    // 🆕 Create new project
    document.getElementById("projectForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const fd = new FormData(form);
      const btn = document.getElementById("submitBtn");

      btn.innerText = "Creating...";
      btn.disabled = true;

      const { error } = await supabase.from("projects").insert([{
        title: fd.get("title"),
        trigger_description: fd.get("trigger"),
        actions_description: fd.get("actions"),
        notes: fd.get("notes"),
        status: "Idea Submitted",
      }]);

      if (error) {
        showMessage("formMessage", "❌ Error creating project: " + error.message, "error");
      } else {
        showMessage("formMessage", "✅ Project created successfully!");
        form.reset();
        loadProjects();
      }
      btn.innerHTML = '<i class="fas fa-rocket mr-2"></i>Create Project';
      btn.disabled = false;
    });

    // Initial load
    loadProjects();
  </script>
</body>
</html>
