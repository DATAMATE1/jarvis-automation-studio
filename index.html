<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarvis Automation Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #050508;
      --s1: #0c0c14;
      --s2: #12121e;
      --s3: #1a1a2e;
      --b1: #252540;
      --b2: #35355a;
      --accent: #00ff88;
      --accent-dim: rgba(0,255,136,0.08);
      --accent-glow: rgba(0,255,136,0.2);
      --purple: #8b5cf6;
      --purple-dim: rgba(139,92,246,0.1);
      --amber: #fbbf24;
      --amber-dim: rgba(251,191,36,0.08);
      --red: #ff4455;
      --red-dim: rgba(255,68,85,0.08);
      --text: #f0f0f8;
      --t2: #8888aa;
      --t3: #44445a;
      --r: 10px;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'Syne', sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      padding: 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--b1);
    }
    .hdr-logo { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.5px; }
    .hdr-logo span { color: var(--accent); }
    .hdr-status {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--t2);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 var(--accent-glow); }
      50% { box-shadow: 0 0 0 5px transparent; }
    }

    .jarvis-wrap {
      background: var(--s1);
      border: 1px solid var(--b1);
      border-radius: 14px;
      padding: 1.75rem;
      margin-bottom: 1.5rem;
      position: relative;
      overflow: hidden;
    }
    .jarvis-wrap::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.4;
    }
    .jarvis-eyebrow {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--accent);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .jarvis-row { display: flex; gap: 0.75rem; }
    .jarvis-input {
      flex: 1;
      background: var(--s2);
      border: 1px solid var(--b1);
      border-radius: var(--r);
      color: var(--text);
      font-family: var(--sans);
      font-size: 1rem;
      font-weight: 500;
      padding: 0.9rem 1.1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .jarvis-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
    .jarvis-input::placeholder { color: var(--t3); font-weight: 400; }
    .btn-find {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--r);
      font-family: var(--sans);
      font-weight: 700;
      font-size: 0.9rem;
      padding: 0.9rem 1.5rem;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-find:hover:not(:disabled) { opacity: 0.85; transform: translateY(-1px); }
    .btn-find:disabled { opacity: 0.35; cursor: not-allowed; }

    .result-area { margin-top: 1.25rem; }

    .itlas-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    @media(max-width: 700px) { .itlas-grid { grid-template-columns: repeat(2, 1fr); } }
    .itlas-cell {
      background: var(--s2);
      border: 1px solid var(--b1);
      border-radius: 8px;
      padding: 0.75rem;
    }
    .itlas-letter {
      font-family: var(--mono);
      font-size: 0.6rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 1px;
      margin-bottom: 0.35rem;
    }
    .itlas-value { font-size: 0.78rem; color: var(--t2); line-height: 1.4; }

    .rec-box {
      background: var(--s2);
      border: 1px solid var(--accent);
      border-radius: var(--r);
      padding: 1.5rem;
      box-shadow: 0 0 40px rgba(0,255,136,0.06);
      animation: fadeUp 0.25s ease;
    }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .rec-eyebrow {
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--accent);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }
    .rec-name { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.75rem; line-height: 1.3; }
    .rec-reason {
      font-size: 0.875rem;
      color: var(--t2);
      line-height: 1.6;
      padding: 0.85rem 1rem;
      background: var(--s1);
      border-left: 2px solid var(--accent);
      border-radius: 0 6px 6px 0;
      margin-bottom: 1.25rem;
    }
    .nodes-label {
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--t3);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    .nodes-row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.25rem; }
    .node-pill {
      font-family: var(--mono);
      font-size: 0.7rem;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      background: var(--purple-dim);
      border: 1px solid rgba(139,92,246,0.2);
      color: #c4b5fd;
    }

    .rec-actions { display: flex; gap: 0.75rem; }
    .btn-approve {
      flex: 1;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--r);
      font-family: var(--sans);
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.85rem 1.5rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-approve:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn-retry {
      background: var(--s3);
      border: 1px solid var(--b2);
      border-radius: var(--r);
      color: var(--t2);
      font-family: var(--sans);
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.85rem 1.25rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-retry:hover { background: var(--b1); }

    .no-match {
      background: var(--red-dim);
      border: 1px solid rgba(255,68,85,0.2);
      border-radius: var(--r);
      padding: 1.25rem 1.5rem;
      animation: fadeUp 0.25s ease;
    }
    .no-match strong { display: block; font-size: 0.95rem; margin-bottom: 0.35rem; color: #ff8899; }
    .no-match p { font-size: 0.82rem; color: var(--t2); }

    .scanning {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--t2);
      padding: 0.75rem 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { display: inline-block; animation: spin 0.7s linear infinite; }

    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
    @media(max-width: 800px) { .cols { grid-template-columns: 1fr; } }

    .panel {
      background: var(--s1);
      border: 1px solid var(--b1);
      border-radius: 14px;
      padding: 1.5rem;
    }
    .panel-title {
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--t3);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
    }

    .field { margin-bottom: 0.65rem; }
    .field input, .field textarea {
      width: 100%;
      background: var(--s2);
      border: 1px solid var(--b1);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 0.875rem;
      padding: 0.65rem 0.9rem;
      outline: none;
      transition: border-color 0.2s;
      resize: vertical;
    }
    .field input:focus, .field textarea:focus { border-color: var(--accent); }
    .field input::placeholder, .field textarea::placeholder { color: var(--t3); }
    .field textarea { min-height: 60px; }

    .btn-create {
      width: 100%;
      background: var(--s3);
      border: 1px solid var(--b2);
      border-radius: var(--r);
      color: var(--text);
      font-family: var(--sans);
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.75rem;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.25rem;
    }
    .btn-create:hover:not(:disabled) { background: var(--b1); }
    .btn-create:disabled { opacity: 0.4; cursor: not-allowed; }

    .project-card {
      background: var(--s2);
      border: 1px solid var(--b1);
      border-radius: 10px;
      padding: 1rem 1.1rem;
      margin-bottom: 0.65rem;
      transition: border-color 0.2s;
    }
    .project-card:hover { border-color: var(--b2); }
    .project-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.3rem; }
    .project-name { font-size: 0.95rem; font-weight: 600; line-height: 1.3; }
    .project-date { font-family: var(--mono); font-size: 0.65rem; color: var(--t3); white-space: nowrap; }
    .project-desc { font-size: 0.8rem; color: var(--t2); line-height: 1.5; margin-bottom: 0.65rem; }
    .project-template { font-family: var(--mono); font-size: 0.72rem; color: var(--accent); margin-bottom: 0.65rem; }

    .badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      margin-bottom: 0.5rem;
    }
    .badge-found { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(0,255,136,0.15); }
    .badge-idea { background: var(--s3); color: var(--t2); border: 1px solid var(--b1); }
    .badge-nomatch { background: var(--red-dim); color: #ff8899; border: 1px solid rgba(255,68,85,0.15); }

    .project-actions { display: flex; gap: 0.4rem; }
    .btn-sm {
      font-family: var(--mono);
      font-size: 0.68rem;
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      border: 1px solid var(--b1);
      background: var(--s3);
      color: var(--t2);
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-sm:hover { background: var(--b1); }
    .btn-sm-danger { border-color: rgba(255,68,85,0.2); color: #ff8899; }
    .btn-sm-danger:hover { background: var(--red-dim); }

    .empty { color: var(--t3); font-size: 0.85rem; text-align: center; padding: 2rem 0; }
    .msg { font-family: var(--mono); font-size: 0.75rem; margin-top: 0.5rem; }
    .msg-ok { color: var(--accent); }
    .msg-err { color: var(--red); }

    .modal-bg {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: var(--s1);
      border: 1px solid var(--b2);
      border-radius: 14px;
      padding: 2rem;
      max-width: 480px;
      width: 90%;
      animation: fadeUp 0.2s ease;
    }
    .modal h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; }
    .modal p { font-size: 0.85rem; color: var(--t2); margin-bottom: 1.25rem; line-height: 1.5; }
    .modal .field { margin-bottom: 1rem; }
    .modal-actions { display: flex; gap: 0.75rem; }
    .btn-modal-ok {
      flex: 1;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      font-family: var(--sans);
      font-weight: 700;
      font-size: 0.9rem;
      padding: 0.75rem;
      cursor: pointer;
    }
    .btn-modal-cancel {
      background: var(--s3);
      border: 1px solid var(--b2);
      border-radius: 8px;
      color: var(--t2);
      font-family: var(--sans);
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.75rem 1.25rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="hdr">
    <div class="hdr-logo">⚡ <span>Jarvis</span> Automation Studio</div>
    <div class="hdr-status">
      <span class="dot"></span>
      <span id="statusText">connecting...</span>
    </div>
  </div>

  <div class="jarvis-wrap">
    <div class="jarvis-eyebrow">// ITLAS — describe the client need</div>
    <div class="jarvis-row">
      <input class="jarvis-input" id="jarvisQuery" type="text"
        placeholder='e.g. "When a lead fills Typeform, notify Slack and add to HubSpot"'
        onkeydown="if(event.key==='Enter') runSearch()" />
      <button class="btn-find" id="findBtn" onclick="runSearch()">⚡ Find Workflow</button>
    </div>
    <div class="result-area" id="resultArea"></div>
  </div>

  <div class="cols">
    <div class="panel">
      <div class="panel-title">// create project manually</div>
      <form id="projectForm">
        <div class="field"><input name="title" placeholder="Project title" required /></div>
        <div class="field"><textarea name="trigger" placeholder="Trigger — what starts this?" required></textarea></div>
        <div class="field"><textarea name="actions" placeholder="Actions — what should happen?" required></textarea></div>
        <div class="field"><textarea name="notes" placeholder="Notes (optional)"></textarea></div>
        <button type="submit" class="btn-create" id="createBtn">+ Create Project</button>
      </form>
      <p class="msg" id="formMsg"></p>
    </div>

    <div class="panel">
      <div class="panel-title">// your projects</div>
      <div id="projectsList"><p class="empty">Loading...</p></div>
    </div>
  </div>

  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h3>Save this workflow?</h3>
      <p id="modalDesc">Saving matched workflow as a project.</p>
      <div class="field">
        <input id="modalTitle" placeholder="Client / project name" style="width:100%;background:var(--s2);border:1px solid var(--b1);border-radius:8px;color:var(--text);font-family:var(--sans);font-size:0.9rem;padding:0.65rem 0.9rem;outline:none;" />
      </div>
      <div class="modal-actions">
        <button class="btn-modal-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-modal-ok" onclick="confirmApprove()">✅ Save Project</button>
      </div>
    </div>
  </div>

<script>
  const SUPABASE_URL = "https://lbbsbiufwdjatjlhpvsg.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxiYnNiaXVmd2RqYXRqbGhwdnNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA1OTk2NzksImV4cCI6MjA3NjE3NTY3OX0._79MBz4Rx6bvCn8ICgeRLG5TW2Cre29UNCFACgEI8rg";
  const JARVIS_MATCH = "https://lbbsbiufwdjatjlhpvsg.supabase.co/functions/v1/jarvis-match";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let current = null;

  async function checkStatus() {
    const { count } = await sb.from('n8n_workflows').select('*', { count: 'exact', head: true });
    document.getElementById('statusText').textContent = `connected · ${count || 2054} workflows ready`;
  }
  checkStatus();

  async function runSearch() {
    const query = document.getElementById('jarvisQuery').value.trim();
    if (!query) return;
    const btn = document.getElementById('findBtn');
    const area = document.getElementById('resultArea');
    btn.textContent = '...'; btn.disabled = true;
    area.innerHTML = `<div class="scanning"><span class="spin">◌</span> Running ITLAS · scanning library...</div>`;
    try {
      const res = await fetch(JARVIS_MATCH, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      if (data.no_match || !data.recommendation) {
        current = null;
        area.innerHTML = `<div class="no-match"><strong>No match found</strong><p>Nothing in 2,054 workflows matches this. Try different wording.</p></div>`;
      } else {
        const r = data.recommendation;
        current = r;
        const cleanName = r.name.replace(/^\d+\s+/, '');
        const knownApps = ['Gmail','Slack','HubSpot','Airtable','Notion','Typeform','Stripe','Shopify',
          'Discord','Telegram','WhatsApp','Zoom','GitHub','Jira','Asana','Trello','Salesforce',
          'Mailchimp','Dropbox','Google Sheets','Google Drive','Google Calendar','Calendly',
          'Twitter','LinkedIn','Instagram','Twilio','OpenAI','Webhook','HTTP Request'];
        const desc = (r.description || '') + ' ' + (r.name || '');
        const found = knownApps.filter(a => desc.toLowerCase().includes(a.toLowerCase()));
        const nodePills = found.length
          ? found.map(a => `<span class="node-pill">${a}</span>`).join('')
          : '<span class="node-pill">n8n workflow</span>';
        const q = query.toLowerCase();
        const triggers = ['form','email','order','payment','webhook','schedule','lead','new row','purchase','submission'];
        const triggerFound = triggers.find(t => q.includes(t)) || 'incoming event';
        const hasLogic = q.includes('if') || q.includes('only') || q.includes('filter') || q.includes('when');
        area.innerHTML = `
          <div class="itlas-grid">
            <div class="itlas-cell"><div class="itlas-letter">I — INTENT</div><div class="itlas-value">${query.length > 55 ? query.substring(0,52)+'...' : query}</div></div>
            <div class="itlas-cell"><div class="itlas-letter">T — TRIGGER</div><div class="itlas-value">${triggerFound}</div></div>
            <div class="itlas-cell"><div class="itlas-letter">L — LOGIC</div><div class="itlas-value">${hasLogic ? 'Conditional routing' : 'Linear — no branching'}</div></div>
            <div class="itlas-cell"><div class="itlas-letter">A — ACTIONS</div><div class="itlas-value">${(r.description||'Automated actions').substring(0,55)}</div></div>
            <div class="itlas-cell"><div class="itlas-letter">S — SAFETY</div><div class="itlas-value" style="color:var(--accent)">✓ Clear</div></div>
          </div>
          <div class="rec-box">
            <div class="rec-eyebrow">⚡ jarvis recommends</div>
            <div class="rec-name">${cleanName}</div>
            <div class="rec-reason">${r.reason}</div>
            <div class="nodes-label">// apps detected</div>
            <div class="nodes-row">${nodePills}</div>
            <div class="rec-actions">
              <button class="btn-approve" onclick="openModal()">✅ Approve — Use This</button>
              <button class="btn-retry" onclick="retry()">↩ Try Again</button>
            </div>
          </div>`;
      }
    } catch(e) {
      area.innerHTML = `<p class="msg msg-err">❌ ${e.message}</p>`;
    }
    btn.textContent = '⚡ Find Workflow'; btn.disabled = false;
  }

  function retry() {
    document.getElementById('resultArea').innerHTML = '';
    document.getElementById('jarvisQuery').value = '';
    document.getElementById('jarvisQuery').focus();
    current = null;
  }

  function openModal() {
    if (!current) return;
    const cleanName = current.name.replace(/^\d+\s+/, '');
    document.getElementById('modalDesc').textContent = `Workflow: "${cleanName}"`;
    document.getElementById('modalTitle').value = cleanName;
    document.getElementById('modalBg').classList.add('open');
    setTimeout(() => document.getElementById('modalTitle').focus(), 100);
  }
  function closeModal() { document.getElementById('modalBg').classList.remove('open'); }
  document.getElementById('modalBg').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

  async function confirmApprove() {
    const title = document.getElementById('modalTitle').value.trim();
    if (!title || !current) return;
    const { error } = await sb.from('projects').insert([{
      title,
      trigger_description: current.description,
      status: '✅ Template Found',
      your_final_choice: current.id,
      template_name: current.name,
    }]);
    if (error) { alert('❌ ' + error.message); return; }
    closeModal();
    document.getElementById('resultArea').innerHTML = '';
    document.getElementById('jarvisQuery').value = '';
    current = null;
    loadProjects();
  }

  function safe(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.textContent;
  }

  async function loadProjects() {
    const list = document.getElementById('projectsList');
    list.innerHTML = '<p class="empty">Loading...</p>';
    const { data, error } = await sb.from('projects').select('*').order('created_at', { ascending: false });
    if (error) { list.innerHTML = '<p class="msg msg-err">Error loading projects.</p>'; return; }
    if (!data || !data.length) { list.innerHTML = '<p class="empty">No projects yet. Use Jarvis above.</p>'; return; }
    list.innerHTML = '';
    data.forEach(p => {
      const card = document.createElement('div');
      card.className = 'project-card';

      // top row
      const top = document.createElement('div');
      top.className = 'project-top';
      const name = document.createElement('div');
      name.className = 'project-name';
      name.textContent = p.title || 'Untitled';
      const date = document.createElement('div');
      date.className = 'project-date';
      date.textContent = new Date(p.created_at).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'2-digit' });
      top.appendChild(name);
      top.appendChild(date);

      // badge
      const status = (p.status || '').toLowerCase();
      const badge = document.createElement('span');
      badge.className = 'badge ' + (status.includes('found') || status.includes('selected') ? 'badge-found' : status.includes('no') ? 'badge-nomatch' : 'badge-idea');
      badge.textContent = status.includes('found') ? 'MATCHED' : status.includes('no') ? 'NO MATCH' : 'IDEA';

      // description
      const desc = document.createElement('div');
      desc.className = 'project-desc';
      const raw = (p.trigger_description || '');
      desc.textContent = raw.length > 120 ? raw.substring(0, 120) + '...' : raw;

      // template line
      const actions = document.createElement('div');
      actions.className = 'project-actions';
      const delBtn = document.createElement('button');
      delBtn.className = 'btn-sm btn-sm-danger';
      delBtn.textContent = '✕ Delete';
      delBtn.addEventListener('click', () => deleteProject(p.id));
      actions.appendChild(delBtn);

      card.appendChild(top);
      card.appendChild(badge);
      card.appendChild(desc);

      if (p.template_name) {
        const tl = document.createElement('div');
        tl.className = 'project-template';
        tl.textContent = '▸ ' + (p.template_name || '').replace(/^\d+\s+/, '');
        card.appendChild(tl);
      }

      card.appendChild(actions);
      list.appendChild(card);
    });
  }

  async function deleteProject(id) {
    if (!confirm('Delete this project?')) return;
    await sb.from('projects').delete().eq('id', id);
    loadProjects();
  }

  document.getElementById('projectForm').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const btn = document.getElementById('createBtn');
    btn.textContent = 'Creating...'; btn.disabled = true;
    const { error } = await sb.from('projects').insert([{
      title: fd.get('title'),
      trigger_description: fd.get('trigger'),
      actions_description: fd.get('actions'),
      notes: fd.get('notes'),
      status: 'Idea Submitted'
    }]);
    const msg = document.getElementById('formMsg');
    if (error) { msg.textContent = '❌ ' + error.message; msg.className = 'msg msg-err'; }
    else { msg.textContent = '✅ Project saved.'; msg.className = 'msg msg-ok'; e.target.reset(); loadProjects(); }
    btn.textContent = '+ Create Project'; btn.disabled = false;
    setTimeout(() => msg.textContent = '', 3000);
  });

  loadProjects();
</script>
</body>
</html>
